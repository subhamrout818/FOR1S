name: Auth security regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/auth-email-authorization-audit"]

permissions:
  contents: read

jobs:
  auth-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
